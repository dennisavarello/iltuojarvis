:root{
  --notte:#0B0E13; --banda:#11151C; --filo:#232A35; --testo:#F3F1EC; --grigio:#9AA3AF;
  --reattore:#7FD8F5; --ok:#1F8A4C; --ok-f:#E3F4EA; --ko:#C2362F; --ko-f:#FBE7E5; --att:#A86A00; --att-f:#FFF3D6;
  --mac:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --curva:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--notte);color:var(--testo);overflow:hidden}
body{font-family:Switzer,var(--mac);display:flex;flex-direction:column;align-items:center}

/* ---------- il Mac ---------- */
#cornice{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px 16px 0}
#scala{position:relative}
#palco{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;border-radius:14px;overflow:hidden;
  font-family:var(--mac);color:#1d1d1f;box-shadow:0 0 0 1px #2b323d,0 30px 80px rgba(0,0,0,.55)}
.sfondo{position:absolute;inset:0;background:#1b2433}
.sfondo svg{position:absolute;inset:0;width:100%;height:100%}
.menu{position:absolute;left:0;right:0;top:0;height:30px;display:flex;align-items:center;gap:22px;padding:0 18px;
  background:rgba(24,30,40,.82);color:#fff;font-size:14px;z-index:9000}
.menu b{font-weight:700}.menu span{opacity:.92}
.menu .dx{margin-left:auto;display:flex;gap:18px;align-items:center}
.menu svg{width:18px;height:18px;fill:#fff}
.desk{position:absolute;inset:30px 0 0 0}
.dock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:10px;padding:9px 12px 13px;
  background:rgba(40,46,58,.72);border:1px solid rgba(255,255,255,.14);border-radius:22px;z-index:8000}
.ic{width:60px;height:60px;display:flex;align-items:center;justify-content:center;position:relative}
.ic img{width:60px;height:60px;object-fit:contain;display:block}
.ic.webapp span{width:52px;height:52px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.ic.webapp img{width:40px;height:40px}
.ic.lettera span{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 24px var(--mac);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.ic.jarvis span{width:52px;height:52px;border-radius:12px;background:#0C1118;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #1F3A47}
.ic.jarvis span i{width:22px;height:22px;border-radius:50%;border:3px solid var(--reattore);box-shadow:0 0 12px var(--reattore)}
.ic .nome{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(30,30,34,.92);color:#fff;font:500 13px var(--mac);padding:4px 10px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.ic:hover .nome,.ic.mostra .nome{opacity:1}
.ic::after{content:"";position:absolute;bottom:-8px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff;opacity:0;transition:opacity .3s}
.ic.su::after{opacity:.85}
.ic.salta{animation:salta .6s var(--curva)}
@keyframes salta{40%{transform:translateY(-18px)}}

/* Jarvis, sempre presente */
.hud{position:absolute;top:40px;left:50%;transform:translateX(-50%);z-index:8500;display:flex;align-items:center;gap:12px;
  padding:9px 18px 9px 14px;background:#0C1118;color:#EAF7FD;border:1px solid #1F3A47;border-radius:12px;
  font:600 15px Switzer,var(--mac);min-width:300px;max-width:760px;transition:opacity .3s}
.hud i{width:14px;height:14px;border-radius:50%;background:var(--reattore);box-shadow:0 0 0 4px rgba(127,216,245,.18),0 0 18px var(--reattore);flex:none}
.hud.lavora i{animation:pulsa 1.1s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 8px rgba(127,216,245,.08),0 0 26px var(--reattore)}}
.hud small{color:#7FA9B9;font-weight:500;margin-right:2px}

/* finestre */
.fin{position:absolute;background:#fff;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 0 .5px rgba(0,0,0,.35),0 22px 60px rgba(0,0,0,.38);opacity:0;transform:scale(.96);
  transition:opacity .45s var(--curva),transform .45s var(--curva)}
.fin.su{opacity:1;transform:none}
.fin.via{opacity:0;transform:scale(.97)}
.barra{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;background:#ECECEE;border-bottom:1px solid #D6D6DA;font-size:13px;color:#4a4a4f}
.semafori{display:flex;gap:8px;flex:none}.semafori i{width:12px;height:12px;border-radius:50%;background:#FF5F57}
.semafori i:nth-child(2){background:#FEBC2E}.semafori i:nth-child(3){background:#28C840}
.barra .tit{flex:1;text-align:center;font-weight:600;margin-right:52px}
.web .barra{height:44px}
.url{flex:1;margin:0 70px 0 18px;height:28px;border-radius:7px;background:#fff;border:1px solid #D9D9DE;display:flex;align-items:center;gap:8px;padding:0 12px;color:#55555b;font-size:13px}
.url svg{width:11px;height:11px;fill:#8a8a90}
.corpo{flex:1;min-height:0;overflow:hidden;position:relative}
.corpo.attesa>*{opacity:0}.corpo>*{transition:opacity .35s}
.carica{position:absolute;left:0;top:0;height:3px;background:#1A73E8;width:0;z-index:2}
.carica.va{animation:carica .9s var(--curva) forwards}
@keyframes carica{60%{width:70%}100%{width:100%;opacity:0}}
.bozza{flex:1;display:flex;flex-direction:column;padding:0;font-size:15px}
.bozza .rg{padding:11px 22px;border-bottom:1px solid #EFEFF2;color:#6e6e73}.bozza .rg b{color:#1d1d1f;font-weight:500}
.bozza .tx{padding:16px 22px;white-space:pre-wrap;line-height:1.5;flex:1}
.bozza .pie{padding:12px 22px;display:flex;gap:10px;align-items:center}
.allegato{display:inline-flex;align-items:center;gap:8px;border:1px solid #DADCE0;border-radius:8px;padding:7px 12px;font-size:13px;margin:0 22px 8px}
.allegato i{width:16px;height:20px;background:#D93A2F;border-radius:2px}
.agenda{padding:10px 20px}
.agenda .gg{font:600 22px var(--mac);padding:6px 0 12px}
.agenda .sl{display:flex;gap:14px;border-top:1px solid #EEE;min-height:46px;padding-top:6px;font-size:13px;color:#8a8a90}
.agenda .sl b{width:50px;font-weight:500}
.agenda .ev{flex:1;background:#E8F1FF;border-left:3px solid #0A84FF;border-radius:4px;padding:6px 10px;color:#1d1d1f;font-size:14px;animation:entra .45s var(--curva)}
.agenda .ev small{display:block;color:#5a6a85}
.cerca{height:32px;width:240px;border:1px solid #D4D4D9;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-size:14px;color:#9a9aa0;margin-left:auto}
.cerca.scr{color:#1d1d1f;border-color:#0A84FF;box-shadow:0 0 0 3px rgba(10,132,255,.2)}

/* app: intestazione dell'app web */
.app-test{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid #ECECEF}
.logo{width:32px;height:32px;border-radius:7px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden}.logo img{width:32px;height:32px;object-fit:contain}
.app-test b{font-size:17px}.app-test small{display:block;color:#7a7a80;font-size:13px;margin-top:2px}
.bott{margin-left:auto;display:flex;gap:8px}
.bt{height:34px;padding:0 16px;border-radius:7px;border:1px solid #D4D4D9;background:#fff;font:600 14px var(--mac);color:#1d1d1f;display:flex;align-items:center}
.bt.pieno{background:var(--colore,#0A66D9);border-color:transparent;color:#fff}
.bt.premuto{transform:scale(.95);filter:brightness(.9)}

/* tabella */
.tab{padding:6px 20px 0;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:#6e6e73;font-size:12.5px;padding:10px 10px;border-bottom:1px solid #E5E5EA}
td{padding:11px 10px;border-bottom:1px solid #F0F0F3;white-space:nowrap;color:#1d1d1f}
tr.nuova{animation:entra .5s var(--curva)}
@keyframes entra{from{opacity:0;transform:translateY(6px)}}
tr.evid td{background:var(--ko-f)}
tr.qui td{background:#EEF4FF}
.es{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:3px 9px;border-radius:6px;font-size:13px}
.es.ok{color:var(--ok);background:var(--ok-f)}.es.ko{color:var(--ko);background:var(--ko-f)}.es.att{color:var(--att);background:var(--att-f)}
td.flash{animation:flash 1.2s}
@keyframes flash{0%{background:#FFF0A8}}
.nota{margin:12px 20px 0;padding:11px 14px;border-radius:8px;background:var(--ko-f);color:#8d2520;font-size:14px;font-weight:600;animation:entra .4s var(--curva)}
.piede{position:absolute;left:0;right:0;bottom:0;padding:12px 20px;border-top:1px solid #ECECEF;background:#FAFAFB;font-size:14px;color:#3a3a3f;font-weight:600;font-variant-numeric:tabular-nums}
.piede:empty{display:none}

/* posta */
.posta{display:flex;height:100%}
.lista{width:44%;border-right:1px solid #E5E5EA;overflow:hidden}
.mail{padding:11px 16px;border-bottom:1px solid #F0F0F3;font-size:13.5px;position:relative}

<script>
// Profilo demo: Telesforo Morsani, Pirotecnica Morsani s.r.l. (Belmonte in Sabina, Rieti). Demo mar 27/10/2026 ore 11:30 con Davide,
// in call anche Edoardo e Marus (ufficio). Versione v4 «l'effetto». Scritto il 25/10/2026 da Mark (Jarvis-Davide).
// Fonti: setting telefonica con Davide del 24/10 (nota GHL, trascrizione intera), questionario del 16/10 («Siamo alla ricerca di nuovi
// clienti»), chat WhatsApp del 23/10 («è pazzesco sono molto interessato»), prova su misura del 24/10
// (vendita-jarvis/chiamate/lead/prova-morsani/: prova.md, lista.csv con fonte su ogni riga, email-hp.md).
// Chi è: fuochi d'artificio dal 1880, piromusicali, video mapping, laser, luci, droni, acqua danzante. Clienti: comuni, pro loco, comitati,
// agenti di spettacolo, privati e aziende. Oggi: gare d'appalto + un commerciale che manda mail, chiama, spedisce brochure.
// Le sue parole: «acquisire tutti quei contatti mail o anche telefonici di tutte quelle realtà che organizzano spettacoli, come proloco,
// comuni, comitati… migliaia di manifestazioni… noi non le conosciamo» · «siamo a Rieti, non possiamo andare a Milano per 500 euro» ·
// «trova il contatto… gli manda la prima mail, a nome della persona fisica… il potenziale cliente risponde e ti fissa una call» ·
// «non ce la fa a seguire tutte le realtà» · «l'azienda che fa 50 anni, la cena di Natale» · «è un hardware o è solo software?» ·
// «dobbiamo mettere un computer dedicato, giusto? Che fa solo quello?» · «abbiamo l'ufficio, tutti i fissi, poi ho il mio portatile» ·
// amministrazione con gli esplosivi: «preferisco farlo fare alla persona che l'ha sempre fatto» (quindi niente contabilità in demo).
// DATI VERI (pubblici, dalla prova del 24/10): affidamenti ANAC 2025 (343, 288 enti, 7,6 mln; 323 diretti; centro Italia 112 per 2,06 mln;
// 93 tra mapping, droni, laser), Civitavecchia biennale 60.000, Sabaudia 140.000, Grosseto 42.073, Formia Capodanno 9.600, L'Aquila droni
// 139.600, Pro Loco Montenero Sabino (Regione Lazio 2025), Villa Colonnetta (4 ettari, 250 invitati), cifra di mezzo 11.500 €.
// Nomi degli assessori NON mostrati (solo il ruolo). D'ESEMPIO, e lo schermo lo dice: ore, risposte ricevute, esiti delle chiamate, aziende.
// ⛔ Promesse controllate su manuale-commerciale.md: Jarvis non telefona (chiamano commerciale e ufficio), ogni mail parte dal suo sì su
// Telegram, sistema operativo non noto («computer»), notte solo con un computer acceso (quale: in call).
// Conto: Jarvis CEO 6.900 € (Davide in setting: «viene 6.900 euro»; Telesforo: «stiamo dentro alle nostre richieste»; CRM 7.000 €).
// Niente rate, garanzia, bandi. cap: [frase grande, riga sotto, testo per la voce di Tony]

// il capitolo della prima mail mostra la sequenza intera (3 mail + telefonata del commerciale). Originale: vendita-jarvis/demo-clienti/morsani-27-10/.

di eventi.. Con una location basta un accordo, e i fuochi li proponete a ogni coppia.": "voce-telesforo-morsani/27dba1a24bd4a9.mp3", "Si parte adesso, dai Comuni del centro Italia.. Tra dicembre e marzo mettono i soldi a bilancio: a giugno hanno già scelto.": "voce-telesforo-morsani/24937f8c3d08ab.mp3", "Ogni mail parte a nome tuo, perché chi organizza una festa sceglie una persona.. Al Comune parli della festa del 2027, alla Pro Loco del contributo, alla location dei suoi sposi.": "voce-telesforo-morsani/fb3412077d121a.mp3", "Prima domanda: trovare chi organizza le feste.. Jarvis apre i dati pubblici: ogni Comune che paga uno spettacolo lo deve pubblicare.": "voce-telesforo-morsani/2b0b242ca84272.mp3", "Da marzo a dicembre 2025, in Italia: 343 affidamenti per fuochi, da 288 enti diversi.. Dati veri. E le feste dei Comuni si ripetono ogni anno.": "voce-telesforo-morsani/0de01ffaa26e1a.mp3", "Civitavecchia ha affidato i fuochi di Ferragosto per due anni, 60.000 euro.. L'affidamento finisce col 2026: per il 2027 sceglie di nuovo. Jarvis trova anche chi decide.": "voce-telesforo-morsani/125e181e00b3de.mp3", "La Pro Loco di Montenero Sabino, a pochi chilometri da voi.. La sua festa di San Cataldo l'ha finanziata la Regione Lazio nel 2025.": "voce-telesforo-morsani/e27275c8b6c52b.mp3", "Villa Colonnetta: matrimoni fino a 250 invitati, tra Roma e Rieti.. Una location fa decine di matrimoni l'anno: con un accordo, i vostri fuochi arrivano a tanti sposi.": "voce-telesforo-morsani/91f9a764da20d9.mp3", "Risposta: i contatti li trova Jarvis, nei dati pubblici e sui siti, con il nome di chi decide.. Questa lista l'ha già fatta per voi: 38 contatti veri, ognuno con la sua fonte.": "voce-telesforo-morsani/612573335f4240.mp3", "Seconda domanda: i filtri. Glieli dici una volta, a voce.. Come li diresti a un collaboratore nuovo.": "voce-telesforo-morsani/c63033c47780a0.mp3", "Primo filtro: solo il centro Italia. Lazio, Umbria, Toscana, Marche, Abruzzo, Campania.. Da 343 affidamenti si passa a 112. Valgono due milioni di euro, dati veri del 2025.": "voce-telesforo-morsani/e7d279f47e994f.mp3", "Secondo filtro: una soglia minima di valore.. Le feste piccole e lontane escono. La cifra la decidi tu.": "voce-telesforo-morsani/31e62e5e7841f3.mp3", "Terzo filtro: fuori chi è già vostro, come il Comune di Rieti.. A un vostro cliente non arriva mai una mail da sconosciuto.": "voce-telesforo-morsani/f03747dea955e6.mp3", "Risposta: i filtri li detti tu una volta. Jarvis li usa su ogni lista, ogni settimana.. Se cambi idea, glielo dici e cambia la lista.": "voce-telesforo-morsani/d9d2f8b4b58696.mp3", "Terza domanda: la prima mail a nome tuo, e quello che succede dopo.. Jarvis prepara la sequenza intera per il Comune di Civitavecchia.": "voce-telesforo-morsani/db3c9401cef496.mp3", "Oggi la prima mail: parla del loro Ferragosto sul mare.. E chiede una cosa sola: chi segue gli eventi in Comune.": "voce-telesforo-morsani/66bfa7de5be306.mp3", "Se non risponde, dopo quattro giorni parte la seconda.. Un altro argomento: i soldi per l'estate si mettono a bilancio adesso.": "voce-telesforo-morsani/2e7918185577c7.mp3", "Dopo dieci giorni la terza, di tre righe.. Chiede solo un nome, e avvisa che chiamerà l'ufficio.": "voce-telesforo-morsani/805560c63f6c99.mp3", "Poi telefona il vostro commerciale. Jarvis non chiama nessuno.. Gli mette la telefonata in agenda, con il nome dell'ente e cosa dire.": "voce-telesforo-morsani/888e1988bde1bb.mp3", "Prima che parta qualcosa, Jarvis ti chiede il sì su Telegram.. Dodici Comuni, stessa sequenza, ognuno con la sua festa.": "voce-telesforo-morsani/0d800d1951d524.mp3", "Risposta: Jarvis scrive tutta la sequenza a nome tuo, e la fa partire col tuo sì.. Al telefono ci va il vostro commerciale, con la chiamata già in agenda.": "voce-telesforo-morsani/123e90b4ab5428.mp3", "Quarta domanda: il commerciale che non ce la fa a seguire tutte le realtà.. Jarvis prepara le chiamate di oggi, prima che l'ufficio chiuda alle cinque.": "voce-telesforo-morsani/5eec2c138db5db.mp3", "Il commerciale chiama Grosseto: i tre spettacoli affidati per il 2025 e il 2026 finiscono.. Accanto c'è già cosa dire, e la domanda giusta: quando chiudete il programma?": "voce-telesforo-morsani/f468730312ffa1.mp3", "Edoardo prepara per la Pro Loco di Montenero la brochure e due proposte, una piccola e una grande.. Così giovedì alle 10 la telefonata parte con i numeri in mano.": "voce-telesforo-morsani/316cde420d9d62.mp3", "Com'è andata lo segna l'ufficio, e Jarvis mette i richiami in calendario.. Grosseto decide a febbraio: il 12 gennaio Jarvis ve lo rimette davanti. Esiti d'esempio.": "voce-telesforo-morsani/388f48200aaabf.mp3", "Risposta: il commerciale non cerca più, chiama.. Jarvis gli prepara chi chiamare, perché adesso e cosa dire. Edoardo e Marus ricevono la loro parte.": "voce-telesforo-morsani/235c88cc9efcf2.mp3", "Quinta domanda: anche i privati e le aziende.. Jarvis cerca le aziende di Roma e Rieti che hanno qualcosa da festeggiare, dai loro siti.": "voce-telesforo-morsani/f6c3b21523ebc7.mp3", "Un'azienda fondata nel 1977 compie cinquant'anni l'anno prossimo. Nome d'esempio.. Jarvis prepara la mail al titolare, con un'idea per la festa.": "voce-telesforo-morsani/29109259c80be7.mp3", "Le agenzie di Roma che organizzano le cene di Natale delle aziende.. Una agenzia sola porta tante cene. Jarvis propone il finale con i fuochi nelle loro offerte.": "voce-telesforo-morsani/8258c0818e237f.mp3", "Risposta: Jarvis trova anche aziende e agenzie, con il motivo per scrivere a ognuna.. Le mail partono col tuo sì, come stamattina.": "voce-telesforo-morsani/2e1bc2ca5e76e1.mp3", "Sesta domanda: Jarvis è un apparecchio o un programma? Serve un computer dedicato?. Jarvis ti fa vedere dove lavora, oggi.": "voce-telesforo-morsani/c6504f63ac7e3b.mp3", "Jarvis è un programma, installato sul tuo computer.. Per partire non serve comprare niente: tutto quello che hai visto oggi è partito da qui.": "voce-telesforo-morsani/7c380802388db1.mp3", "Per farlo lavorare anche di notte, serve un computer che resti acceso.. In ufficio avete già i fissi. Quale usare lo decidiamo insieme in call.": "voce-telesforo-morsani/742930cd94fc76.mp3", "Fuori dall'ufficio lo raggiungi da Telegram, scritto o con un vocale.. Risposta: un programma sul tuo computer, e un fisso acceso se lo volete anche di notte.": "voce-telesforo-morsani/73108a5d8212d3.mp3", "E questo non me l'avevi chiesto.. Jarvis apre tre cose trovate da solo, leggendo dieci mesi di dati pubblici.": "voce-telesforo-morsani/ca216fac56668b.mp3", "Tu guardi le gare. Ma da marzo a dicembre 2025, 323 affidamenti su 343 sono stati fatti senza gara.. Il Comune chiede il preventivo a chi conosce già. Jarvis fa in modo che conoscano voi.": "voce-telesforo-morsani/f6d5f2e6b31fd0.mp3", "I Comuni mettono i soldi nel bilancio tra dicembre e marzo.. Chi arriva adesso entra nel bilancio. Chi arriva a giugno trova la scelta già fatta.": "voce-telesforo-morsani/1ccfc4dea5abbc.mp3", "Altri 93 affidamenti sono per video mapping, droni e laser, le vostre nuove arti.. L'Aquila ha speso 139.600 euro in droni. Voi droni e fuochi li mettete nello stesso spettacolo.": "voce-telesforo-morsani/ce3b8db1d92093.mp3", "E adesso le tue domande, una per una.. Jarvis riapre la lista di stamattina e spunta quelle risolte.": "voce-telesforo-morsani/61421807635632.mp3", "Trovare chi organizza, e i tuoi filtri: fatto.. Trentotto enti veri, solo centro Italia, sopra la tua soglia.": "voce-telesforo-morsani/5568f6f4e74afc.mp3", "La prima mail e il commerciale: fatto.. Tre mail a nome tuo, partite col tuo sì, e sedici chiamate pronte per l'ufficio.": "voce-telesforo-morsani/deb29892f02d91.mp3", "Aziende e computer: fatto. E tre cose che non avevi chiesto.. Resta l'investimento. Te lo diciamo adesso, una cifra alla volta.": "voce-telesforo-morsani/471922e204c506.mp3", "Ora l'investimento, una cifra alla volta.. Jarvis mette a confronto tre strade.": "voce-telesforo-morsani/0150ee8f94fc96.mp3", "Un commerciale in più costa circa 30.000 euro l'anno.. Jarvis CEO: 6.900 euro, una volta sola.": "voce-telesforo-morsani/9c63192ea0bb12.mp3", "Dal secondo anno lo stipendio resta uguale.. Per Jarvis resta l'abbonamento a Claude, a tuo nome: circa 100 dollari al mese.": "voce-telesforo-morsani/108cef611a0f7b.mp3", "Il conto lo fai tu. Nel 2025 uno spettacolo tipico per un ente pubblico vale 11.500 euro.. Quanto vale per voi un Comune in più all'anno? In call mettiamo il vostro numero.": "voce-telesforo-morsani/cc7fc816ddf6c4.mp3", "La tua squadra: un agente costruito sul vostro commerciale, e altri quattro.. Questo è Jarvis, sul tuo computer. Tu parli, lui lavora e ti chiede il sì.": "voce-telesforo-morsani/f31c77f9651f44.mp3"};

  if (p.msg) {
    const m = p.msg;
    if (m.chi === "io" && !subito) {
      const ins = T(m.f, ".ins"); ins.classList.add("scr");
      for (let k = 1; k <= m.t.length; k += 2) { ins.textContent = m.t.slice(0, k); SFX.tasto(); await attendi(30, g); }
      await attendi(250, g); ins.textContent = "Scrivi un messaggio…"; ins.classList.remove("scr");
    }
    T(m.f, ".flusso").appendChild(bolla(m)); m.chi === "io" ? SFX.msgFuori() : SFX.msgDentro(); await attendi(700, g);
  }
  if (p.file) { T(p.file.f, ".files").appendChild(el("div", "file", `<i></i>${esc(p.file.nome)}`)); SFX.file(); await attendi(600, g); }
  if (p.notifica) {
    const a = APPS[p.notifica.app] || { c: "#333", g: "J" };
    const n = el("div", "nt", `<div class="ic ${classeIcona(a)}">${iconaHTML(a)}</div><div><b>${esc(p.notifica.tit)}</b>${esc(p.notifica.t)}</div>`);
    $("notif").prepend(n); SFX.notifica(); setTimeout(() => { n.classList.add("via"); setTimeout(() => n.remove(), 450); }, (p.notifica.ms || 5200) / vel);
    await attendi(900, g);
  }
  if (p.conta) {
    const ns = F[p.conta.f].nodo.querySelectorAll("[data-n]");
    for (let i = 0; i <= 26; i++) { ns.forEach(n => n.textContent = Math.round(+n.dataset.n * (1 - Math.pow(1 - i / 26, 3))).toLocaleString("it-IT")); if (i % 2) SFX.tic(); if (i === 26) SFX.cassa(); if (subito) { ns.forEach(n => n.textContent = (+n.dataset.n).toLocaleString("it-IT")); break; } await attendi(40, g); }
  }
  if (p.olo) await oloApri(p.olo, g);
  if (p.oloNumeri) await oloNumeri(p.oloNumeri, g);
  if (p.oloSotto != null) { const s = $("olo").querySelector(".osotto"); s.classList.add("via"); await attendi(250, g); s.textContent = p.oloSotto; s.classList.remove("via"); await attendi(400, g); }
  if (p.oloAgente != null) { OLO.qui = p.oloAgente; OLO.agenti.forEach((a, i) => a.nodo.classList.toggle("qui", i === p.oloAgente)); SFX.oloAgente(); await attendi(700, g); }
  if (p.oloVia) { oloChiudi(); SFX.oloVia(); await attendi(800, g); }
  if (p.dici) await dici(p.dici, g);
  if (p.fumettoVia) { $("fumetto").classList.remove("su"); await attendi(300, g); }
  if (p.telefono) await telefono(p.telefono, g);
  if (p.rispondi) { await clicca($("tel").querySelector(".si"), g); SFX.basta(); SFX.ok(); const T2 = $("tel"); T2.classList.remove("squilla"); T2.classList.add("incall"); T2.querySelector(".st").textContent = "00:01"; await attendi(500, g); }
  if (p.telRiga) { const d = el("div", p.telRiga.chi === "io" ? "io" : "", `<b>${p.telRiga.chi === "io" ? "Lei" : "Jarvis"}</b>${esc(p.telRiga.t)}`); $("tel").querySelector(".tr").appendChild(d); if (p.telRiga.min) $("tel").querySelector(".st").textContent = p.telRiga.min; await attendi(900, g); }
  if (p.telVia) { SFX.basta(); SFX.oloVia(); $("tel").classList.remove("su", "squilla"); await attendi(500, g); }
  if (p.pausa) await attendi(p.pausa, g);
}

function pulisci() { Object.keys(F).forEach(id => chiudi(id, true)); $("notif").innerHTML = ""; $("olo").classList.remove("su"); OLO.on = false; $("hud").style.opacity = ""; $("dock").style.opacity = ""; $("fumetto").classList.remove("su"); $("tel").classList.remove("su", "squilla", "incall"); SFX.basta(); $("app-attiva").textContent = "Finder"; }
function prepara(i) {
  scenaQui = i; pulisci(); const s = DEMO.scene[i]; ora(s.ora, s.giorno); $("cursore").style.transform = "translate(1180px,640px)";
  $("hud-t").textContent = "in ascolto"; $("hud").classList.remove("lavora");
  const c = $("cap"); c.querySelector("b").textContent = s.titolo; c.querySelector("span").textContent = s.ora;
  document.querySelectorAll(".cap").forEach((b, k) => { b.classList.toggle("qui", k === i); b.querySelector("i").style.width = k < i ? "100%" : "0"; });
}
async function suona(i, g) {
  prepara(i); const pp = DEMO.scene[i].passi; const bar = document.querySelectorAll(".cap i")[i];
  await attendi(500, g);
  for (let k = 0; k < pp.length; k++) { await passo(pp[k], g); bar.style.width = Math.round((k + 1) / pp.length * 100) + "%"; }
}
function finita(i) { const g = ++giro; subito = true; suona(i, g).catch(() => {}).finally(() => { subito = false; }); }

function suonoAvvio() { if (!voceOn || (typeof DEMO !== "undefined" && DEMO.suoni === false)) return; try { const a = new Audio(AVVIO_MP3); a.volume = 0.9; a.play().catch(() => {}); } catch (e) {} }
async function avvia(da) {
  const g = ++giro; inCorso = true; aggiornaPlay(); try { speechSynthesis?.cancel(); } catch (e) {}
  suonoAvvio();
  musicaVia();
  try { for (let i = da; i < DEMO.scene.length; i++) { await suona(i, g); await attendi(DEMO.ritmo ? 700 : 1800, g); } }
  catch (e) { if (!(e instanceof Stop)) console.error(e); return; }
  if (g === giro) { inCorso = false; aggiornaPlay(); }
}
function ferma() { giro++; inCorso = false; aggiornaPlay(); SFX.basta(); if (MUS) MUS.pause(); try { speechSynthesis?.cancel(); } catch (e) {} if (audioOra) audioOra.pause(); }
function aggiornaPlay() { $("play").textContent = inCorso ? "Pausa" : "Avvia"; }

/* ---------- avvio ---------- */
document.title = DEMO.titolo;
dock();
$("capitoli").innerHTML = DEMO.scene.map((s, i) => `<button class="cap" type="button" data-i="${i}"><i></i><b>${esc(s.ora)}</b><span>${esc(s.titolo)}</span></button>`).join("");
